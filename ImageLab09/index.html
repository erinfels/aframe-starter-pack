<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere position="0 1.25 -5" radius="1" color="#FFF"></a-sphere>
      <a-sphere position="0 2.75 -5" radius=".75" color="#FFF"></a-sphere>
      <a-sphere position="0 3.75 -5" radius=".5" color="#FFF"></a-sphere>
      <a-sphere position="-.15 3.75 -4.55" radius=".05" color="#000"></a-sphere>
      <a-sphere position=".15 3.75 -4.55" radius=".05" color="#000"></a-sphere>
      <a-cylinder position="0 4.25 -5" radius="0.4" height=".5" color="#000"></a-cylinder>
      <a-box position="0 4 -5" color="#000" depth="1" height=".05" width="1"></a-box>
      <a-cone color="orange" position="0 3.6 -4.5" radius-bottom=".05" radius-top="0.01" rotation="0 270 270"></a-cone>
      <a-cylinder position="-1 3 -5" radius="0.01" height="1" color="brown" rotation="0 45 270"></a-cylinder>
      <a-cylinder position="1 3 -5" radius="0.01" height="1" color="brown" rotation="0 -45 270"></a-cylinder>
      <a-sphere position="-.25 3.52 -4.55" radius=".03" color="#000"></a-sphere>
      <a-sphere position="-.15 3.45 -4.55" radius=".03" color="#000"></a-sphere>
      <a-sphere position="-.05 3.4 -4.55" radius=".03" color="#000"></a-sphere>
      <a-sphere position=".05 3.4 -4.55" radius=".03" color="#000"></a-sphere>
      <a-sphere position=".15 3.45 -4.55" radius=".03" color="#000"></a-sphere>
      <a-sphere position=".25 3.52 -4.55" radius=".03" color="#000"></a-sphere>
      <a-sky color="#ECECEC"></a-sky>
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: forest; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
